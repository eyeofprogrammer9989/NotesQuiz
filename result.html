<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoteQuiz - Results</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="notebook">
      <h1>NoteQuiz</h1>
      <h2>Your score</h2>

      <div class="score-box">
        <div id="scoreText" class="score-number">0 / 0</div>
      </div>

      <h3>Question review</h3>
      <div id="reviewList" class="review-list">
        <!-- List of questions with user answer and correct answer -->
      </div>

      <div class="actions-row">
        <button type="button" id="retakeBtn" class="primary-btn">Retake quiz</button>
        <button type="button" id="backBtn">Back to notes</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
